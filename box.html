<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>box</title>
	<style>		
   .block
   {	
			height: 200px;
			width: 200px;
			background-color: blue;
			margin-bottom: 0px;
			padding-bottom: 10px;
			color: skyblue;
			line-height: 100px;
			animation-name: appear;
			animation-duration: 2s;
			animation-timing-function: ease;	
			animation-iteration-count: 2;			
   }
   
	@keyframes appear
	{
	  0%
	  {
	  	width: 200px; 
       scale: 0;
	  }
	  50%
	  {
	  	width: 700px;
	   height: 700px;
	   scale: 1;
	  }
100%
{
	width: 200px;
	height: 200px;
}

	}
	</style>
</head>
<body>
<div class="block"> </div>
</body>
</html>
