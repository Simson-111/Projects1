<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Responsive Entry Form</title>
  <style> 
    body {

      font-family: Arial, sans-serif;
      background-color: #AEB877;
      margin: 0;
      padding: 0;
    }
    .form-container 
    {
      width: 400px;
      margin: 80px auto;
      padding: 30px;
      backdrop-filter: blur(7px);
      border-radius: 17px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
       }

    input 
    {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover 
    {
      background-color: #0056b3;
    }

    .image
     {
     position: absolute;
     background-image: url("car.jpeg");
     background-repeat: no-repeat;
     background-attachment: fixed;
     top: 0;
     left:0 ;
     width: 100%;
     background-size: cover;
     z-index: -1;
     min-height: 100vh;
    }
   
    @media (max-width: 1024px) {
      .form-container {
        width: 60%;
      }
    }
    @media (max-width: 767px) {
      .form-container {
        width: 90%;
        margin: 40px auto;
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }

      input, button {
        font-size: 14px;
        padding: 10px;
      }
    }
</style>
</head>
<body>
<div class="image">
  <div class="form-container">
    <h2>shivashri</h2>
    <form>
      <input type="text" placeholder="EnterName" required>
      <input type="text" placeholder="courseName" required>
      <input type="email" placeholder="EnterEmail" required>
      <input type="text" placeholder="EnterPhone Number" required>
      <label>Date of Birth</label>
       <input type="date" placeholder="" required>
      <button type="submit">Submit</button>
    </form>
  </div>
</div>
</body>
</html>
