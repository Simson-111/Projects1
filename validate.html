<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stylish Validation Form</title>
<style>
    body{
        font-family: Poppins, Arial;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .form-box{
        width: 350px;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        animation: fadeIn 1.2s ease-in-out;
    }

    h3{
        text-align: center;
        color: #444;
        margin-bottom: 10px;
    }

    input{
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
    }

    input:focus{
        border-color: #2575fc;
        box-shadow: 0 0 10px rgba(37,117,252,0.3);
        outline: none;
    }

    button{
        width: 100%;
        padding: 12px;
        background: #2575fc;
        color: white;
        font-size: 16px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        margin-top: 10px;
        transition: 0.3s;
    }

    button:hover{
        background: #6a11cb;
        transform: scale(1.05);
    }

    .error{
        color: red;
        font-size: 14px;
        text-align: center;
        margin-top: 5px;
        height: 20px;
    }
    .form-box input
    {
        width:320px;
    }

    @keyframes fadeIn{
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>
<body>

<div class="form-box">
    <h3>Student Registration</h3>
    
    <form onsubmit="return validateForm()">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="phone" placeholder="Enter Phone Number">
        <input type="text" id="regno" placeholder="Enter Register Number">
        
        <p class="error" id="message"></p>

        <button type="submit">Submit</button>
    </form>
</div>

<script>
function validateForm(){
    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let regno = document.getElementById("regno").value.trim();
    let msg = document.getElementById("message");

    if(name === "" || phone === "" || regno === ""){
        msg.innerHTML = "⚠ All fields are required!";
        return false;
    }

    if(phone.length !== 10 || isNaN(phone)){
        msg.innerHTML = "⚠ Phone must be 10 digits!";
        return false;
    }

    if(regno.length < 6){
        msg.innerHTML = "⚠ Register number must be at least 6 characters!";
        return false;
    }

    msg.innerHTML = "✔ Form Submitted Successfully!";
    msg.style.color = "green";
    return false;
}
</script>
</body>
</html>
